# Edge forecasting service. Horizons are in seconds of event time, at a 1 s aggregation step.
arm = "river"          # arm tag on everything this service writes (A/B arms differ here)
day_s = 86400          # seasonal period P
models = ["persistence", "seasonal_naive", "seasonal_anchor", "holt", "snarimax", "lin_lag", "lin_lag_static", "lin_lag_adwin", "lin_lag_reset", "hat"]
# "arf" is the expensive one: add it for a dedicated run (config/edge-heavy.toml, later)

[model.snarimax]
stride = 10
[model.lin_lag_static]
static_after = 172800  # train on the first 2 simulated days, then freeze

[streams.temp]
horizons = [10, 60, 600, 3600]
[streams.pressure]
horizons = [60, 600, 3600]
[streams.wind]
horizons = [1, 5, 30, 120]
[streams.vibration]
horizons = [1, 5, 30, 120]
[streams.solar]
horizons = [5, 30, 60, 300]
