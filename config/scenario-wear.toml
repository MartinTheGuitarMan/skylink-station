# Job W (C9, slow degradation): 21 days with one wear ramp on vibration. Dev seeds 1-3 and 41-60 only.
[run]
seed = 41
duration_days = 21
epoch = "2026-01-01T00:00:00Z"
streams = ["temp", "pressure", "wind", "vibration", "solar"]
fault_rate_scale = 1.0
batch_s = 10

[wear]                     # see the C9 amendment in docs/success-criteria.md
streams = ["vibration"]
count = 1
onset_days = [3.0, 7.0]
ramp_days = [4.0, 14.0]
factor = [1.5, 3.0]        # final multiplier of the broadband background

[skylink]
mean_up_s = 14400
mean_down_s = 2400
max_buffer_points = 3000000
backfill_chunk_points = 5000
backfill_shuffle_window = 8
