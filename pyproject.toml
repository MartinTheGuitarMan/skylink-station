[project]
name = "skylink-station"
version = "0.1.0"
description = "Local agents + River online ML on high-frequency streams under unreliable connectivity"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "river>=0.21",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
  "pyarrow>=15",
]

[project.optional-dependencies]
agent = ["mcp>=1.9", "jsonschema>=4"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
skylink-sim = "skylink.sim.replay:main"
skylink-edge = "skylink.edge.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skylink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
